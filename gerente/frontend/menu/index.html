<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>BookShop | Menu</title>

    <link
        rel="stylesheet"
        href="../css/menu.css"
    >

  <link rel="stylesheet" href="/css/identificacao.css">
  <link rel="stylesheet" href="/css/paleta-roxa.css">
  <link rel="stylesheet" href="/css/temas.css">
  <script src="/js/tema.js" defer></script>
</head>


<body class="menu-page manager-home">


    <!-- =====================================================
         CABEÇALHO
         ===================================================== -->

    <header class="site-header">

        <div class="header-content">

            <h1 class="site-title">
                BOOKSHOP
            </h1>

            <p class="site-subtitle">
                sonhos dourados como a alvorada
            </p>
            <div class="manager-session" aria-live="polite">
                <span id="manager-greeting">A verificar sessão...</span>
                <button id="manager-logout" class="logout-button" type="button">Sair</button>
            </div>

        </div>

    </header>


    <!-- =====================================================
         NAVEGAÇÃO
         ===================================================== -->

    <nav
        class="manager-nav menu-nav"
        aria-label="Menu principal"
    >

        <ul class="menu-links">

            <li>
                <a
                    class="menu-link"
                    href="../livros/livros.html"
                >
                    LIVROS
                </a>
            </li>

            <li>
                <a
                    class="menu-link"
                    href="../lancamentos/lancamentos.html"
                >
                    LANÇAMENTOS
                </a>
            </li>

            <li>
                <a
                    class="menu-link"
                    href="../cargos/cargos.html"
                >
                    CARGOS
                </a>
            </li>

            <li>
                <a
                    class="menu-link"
                    href="../pessoas/pessoas.html"
                >
                    PESSOAS
                </a>
            </li>
            <li>
                <a
                    class="menu-link"
                    href="../pedidos/pedidos.html"
                >
                    PEDIDOS
                </a>
            </li>

            <li><a class="menu-link" href="../descontos/descontos.html">DESCONTOS</a></li>
            <li>
                <a class="menu-link" href="/vitrine/index.html">
                    VOLTAR À VITRINE
                </a>
            </li>

        </ul>

    </nav>


    <!-- =====================================================
         CONTEÚDO PRINCIPAL
         ===================================================== -->

    <main class="menu-main">


        <!-- =================================================
             CARROSSEL
             ================================================= -->

        <section
            class="menu-carousel"
            aria-label="Imagens da BookShop"
        >

            <!-- IMAGEM ATUAL -->

            <img
                id="carousel-image"
                class="menu-carousel-image"
                src="/admin-imagens/menu1.jpe"
                alt="Imagem da BookShop"
            >


            <!-- SETA ESQUERDA -->

            <button
                id="carousel-prev"
                class="carousel-button carousel-prev"
                type="button"
                aria-label="Imagem anterior"
            >
                ‹
            </button>


            <!-- SETA DIREITA -->

            <button
                id="carousel-next"
                class="carousel-button carousel-next"
                type="button"
                aria-label="Próxima imagem"
            >
                ›
            </button>


            <!-- INDICADORES -->

            <div
                id="carousel-indicators"
                class="carousel-indicators"
                aria-label="Imagens do carrossel"
            >

                <button
                    class="carousel-indicator active"
                    type="button"
                    aria-label="Imagem 1"
                ></button>

                <button
                    class="carousel-indicator"
                    type="button"
                    aria-label="Imagem 2"
                ></button>

                <button
                    class="carousel-indicator"
                    type="button"
                    aria-label="Imagem 3"
                ></button>

            </div>

        </section>


    </main>


    <!-- =====================================================
         RODAPÉ
         ===================================================== -->

    <footer class="site-footer academic-footer">
        <a class="manager-theme-link" href="/perfil.html#tema">Tema</a>

        <p>Luana Cazarin de Almeida · Turma M32 · 2026</p>

    </footer>


    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script src="../js/menu.js"></script>
    <script src="../js/sessao-gerente.js"></script>

</body>

</html>
