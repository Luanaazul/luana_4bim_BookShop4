<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BookShop | Vitrine</title>
  <link rel="stylesheet" href="../css/shop-base.css">
  <link rel="stylesheet" href="../css/vitrine.css">
  <script src="../js/api-config.js" defer></script>
  <script src="../js/carrinho-store.js?v=perfil" defer></script>
  <script src="../js/vitrine.js?v=campanhas" defer></script>
  <link rel="stylesheet" href="/css/identificacao.css">
  <link rel="stylesheet" href="/css/paleta-roxa.css">
  <link rel="stylesheet" href="/css/temas.css">
  <script src="/js/tema.js" defer></script>
</head>
<body class="storefront-page">
  <header class="storefront-header">
    <div class="storefront-brand">
      <img class="theme-logo" src="/imagens/logoGato.jpeg" alt="">
      <h1>BOOKSHOP</h1>
      <p>Livros para a sua próxima leitura</p>
    </div>
    <nav class="shop-actions" aria-label="Navegação da livraria">
      <div id="account-area" class="account-area" aria-live="polite">
        <a class="account-link" href="/login/login.html">
          <span class="person-icon" aria-hidden="true"></span>
          <span>Entrar</span>
        </a>
      </div>
      <a class="cart-link" href="/carrinho/carrinho.html">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M3 4h2l2.2 10.2a2 2 0 0 0 2 1.6h8.4a2 2 0 0 0 1.9-1.4L21 8H6"></path>
          <circle cx="10" cy="20" r="1.2"></circle>
          <circle cx="18" cy="20" r="1.2"></circle>
        </svg>
        <span class="cart-label">Carrinho</span>

      </a>
    </nav>
  </header>
  <main class="storefront-layout">
    <aside class="filter-panel" aria-labelledby="filter-title">
      <h2 id="filter-title">
        <svg aria-hidden="true" viewBox="0 0 24 24">
          <path d="M4 6h16M7 12h10m-7 6h4"></path>
          <circle cx="9" cy="6" r="1.5"></circle>
          <circle cx="15" cy="12" r="1.5"></circle>
          <circle cx="11" cy="18" r="1.5"></circle>
        </svg>
        Filtros
      </h2>
      <form id="store-search" class="store-search" role="search">
        <div class="filter-field">
          <label for="vitrine-search">Título</label>
          <input id="vitrine-search" type="search" placeholder="Pesquisar por título...">
        </div>
        <div class="filter-field">
          <label for="vitrine-genre">Gênero</label>
          <select id="vitrine-genre">
            <option value="">Selecionar gênero</option>
          </select>
        </div>
        <div class="filter-field">
          <label for="vitrine-max-pages">Número máximo de páginas</label>
          <input id="vitrine-max-pages" type="number" min="1" step="1" inputmode="numeric"
            placeholder="Ex.: 300">
        </div>
        <div class="filter-field">
          <label for="vitrine-max-price">Preço máximo (R$)</label>
          <input id="vitrine-max-price" type="number" min="0" step="0.01" inputmode="decimal"
            placeholder="Ex.: 50,00">
        </div>
        <div class="filter-actions">
          <button class="search-button" type="submit">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="10.8" cy="10.8" r="6.3"></circle>
              <path d="m16 16 4.2 4.2"></path>
            </svg>
            Procurar
          </button>
          <button id="clear-store-filters" class="clear-button" type="reset">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 7v5h-5M4.8 9a7 7 0 0 1 12-2L20 12M4 17v-5h5m10.2 3a7 7 0 0 1-12 2L4 12"></path>
            </svg>
            Limpar
          </button>
        </div>
      </form>
      <nav class="social-links" aria-label="Redes sociais e contato">
        <a href="https://www.instagram.com/bookshop.dourada/" target="_blank" rel="noopener noreferrer" aria-label="Instagram da BookShop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <rect x="3" y="3" width="18" height="18" rx="5"></rect>
            <circle cx="12" cy="12" r="4"></circle>
            <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor" stroke="none"></circle>
          </svg>
        </a>
        <a href="https://wa.me/5544998184017?text=Ol%C3%A1%21%20Encontrei%20o%20contato%20pelo%20site%20da%20BookShop%20e%20gostaria%20de%20tirar%20uma%20d%C3%BAvida.%20Poderia%20me%20ajudar%3F" target="_blank" rel="noopener noreferrer" aria-label="WhatsApp da BookShop">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M20.2 11.7a8.2 8.2 0 0 1-12.1 7.2L4 20l1.1-4a8.2 8.2 0 1 1 15.1-4.3Z"></path>
            <path d="M9 8.5c.3-.5.6-.5.9-.5h.4c.2 0 .4.1.5.4l.7 1.6c.1.2.1.4-.1.6l-.5.6c-.2.2-.2.4 0 .6.5.9 1.2 1.6 2.1 2.1.2.1.4.1.6-.1l.7-.8c.2-.2.4-.2.6-.1l1.5.7c.3.1.4.3.4.5 0 .4-.2 1-.6 1.3-.4.4-1 .6-1.6.6-1 0-2.3-.5-3.8-1.8-1.3-1.2-2.1-2.7-2.3-3.6-.2-.9.1-1.7.5-2.1Z"></path>
          </svg>
        </a>
      </nav>
    </aside>
    <section class="storefront" aria-labelledby="storefront-title">
      <div class="storefront-heading">
        <h2 id="storefront-title">Nossos Livros</h2>
        <p>Descubra histórias incríveis e encontre o seu próximo favorito.</p>
      </div>
      <p id="storefront-status" class="storefront-status" role="status" aria-live="polite">
        Carregando livros...
      </p>
      <div id="storefront-grid" class="storefront-grid"></div>
    </section>
  </main>
  <footer class="academic-footer"><p>Luana Cazarin de Almeida · Turma M32 · 2026</p></footer>
</body>
</html>
